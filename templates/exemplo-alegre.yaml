        label: Mais Rápido de Ler
        trend: recorde
        trendUp: true
        icon: zap
        text: Zero cansaço visual
      - value: 2.100+
        label: Ícones Disponíveis
        trend: ilimitado
        trendUp: true
        icon: sparkles
        text: Elementos gráficos prontos
  - layout: steps
    kicker: Fluxo Visual
    title: Processo Simples em 3 Etapas
    steps:
      - stepNum: 1
        title: Rascunho
        text: Escolha o tema Rabisco ou Oceano
        icon: pen-tool
        tag: 1 Minuto
      - stepNum: 2
        title: Visualizar
        text: Troque parágrafos por cards e métricas
        icon: layout-grid
        tag: Auto-Fit
      - stepNum: 3
        title: Apresentar
        text: Entregue um show no palco sem sono
        icon: smile
        tag: Aplausos
  - layout: cards
    kicker: Cartões Inteligentes
    title: Widgets que Eliminam Textão
    cols: 3
    items:
      - icon: check-circle-2
        badge: Recomendado
        title: Checklist Visual
        text: Substitui listas sem graça por confirmações visuais.
