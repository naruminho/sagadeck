    kicker: Ideias Vivas · Sem Sono
    title: Como Criar Slides Bonitinhos & Visuais
    subtitle: Menos texto longo, muito mais impacto e cores alegres
    author: SagaDeck Studio
  - layout: stats
    kicker: Métricas em Destaque
    title: O Poder dos Números Visuais
    stats:
      - value: 98.7%
        label: Retenção da Atenção
        trend: +34%
        trendUp: true
        icon: heart
        text: Público conectado do início ao fim
