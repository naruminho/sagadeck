        checkText: Pronto para uso
      - icon: target
        title: Meta de Conclusão
        text: Progresso visual fácil de acompanhar.
        progress: 88
        progressLabel: Meta Atingida
      - icon: award
        title: Avaliação do Público
        text: Nota máxima dada pela audiência.
        rating: 5
        ratingLabel: 5.0 no G2
        tags:
          - Alegre
          - Dinâmico
          - Sem Sono
