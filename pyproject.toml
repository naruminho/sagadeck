[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sagadeck"
dynamic = ["version"]
description = "Apresentações a partir de YAML: HTML animado, PowerPoint editável, PDF e roteiro — com temas, pictogramas e gráficos gerados na hora."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Narumi Abe" }]
keywords = ["slides", "presentation", "pptx", "powerpoint", "yaml", "deck", "llm", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: JavaScript",
  "Topic :: Multimedia :: Graphics :: Presentation",
  "Topic :: Office/Business :: Office Suites",
]

[project.urls]
Homepage = "https://github.com/naruminho/sagadeck"
Repository = "https://github.com/naruminho/sagadeck"
Issues = "https://github.com/naruminho/sagadeck/issues"

[project.scripts]
sagadeck = "sagadeck.cli:main"

[tool.hatch.version]
path = "python/sagadeck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["python/sagadeck"]
# o motor é gerado por `npm run bundle` e fica fora do git, então precisa ser incluído explicitamente
artifacts = ["python/sagadeck/engine/**"]

[tool.hatch.build.targets.sdist]
include = ["python/sagadeck", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]
artifacts = ["python/sagadeck/engine/**"]
