# Deck de teste da suíte (npm test). Cobre um pouco de tudo que o Studio edita.
# Os testes copiam este arquivo para uma pasta temporária — pode mudar à vontade,
# mas mantenha os slides que os testes procuram (por layout ou título).
title: Deck de teste
theme: bauhaus
duration: 10
slides:
  - layout: cover
    kicker: Suíte de testes
    title: Título da ==capa==
    subtitle: Subtítulo
    author: Equipe
    figure: { icon: rocket, size: 320 }

  - layout: cards
    kicker: Pilares
    title: Três pilares
    items:
      - { icon: shield, title: Seguro, text: Criptografia de ponta a ponta }
      - { icon: zap, title: Rápido, text: "**Carrega** num instante" }
      - { icon: heart, title: Simples, text: Sem manual }

  - layout: timeline
    title: Linha do tempo
    build: true
    events:
      - { when: "2019", title: Início }
      - { when: "2022", title: Virada }
      - { when: "2026", title: Hoje }

  - layout: compare
    title: Antes × depois
    left: { label: Antes, value: 3 dias }
    right: { label: Depois, value: 2 h, hl: true }

  - layout: blocks
    title: Três lugares para colocar um humano
    content:
      - row:
          - col: [{ icon: user, size: 160 }, { h2: HITL }, { body: A máquina sugere. }]
            step: 1
          - col: [{ icon: eye, size: 160 }, { h2: HOTL }, { body: A máquina decide. }]
            step: 2
          - col: [{ icon: moon, size: 160 }, { h2: HOOTL }, { body: A máquina faz tudo. }]
            step: 3

  - layout: statement
    kicker: A ideia
    text: Uma frase que ==muda tudo==.

  - layout: stats
    title: Resultados
    stats:
      - { value: "+42%", label: Receita }
      - { value: "91", label: NPS }

  - layout: full
    image_prompt: foto de uma sala de controle à noite
    title: Página inteira
    overlay: bottom

  # transborda de propósito (colunas altas + linha embaixo): o motor precisa reduzir, não sobrepor
  - layout: blocks
    kicker: Aperto
    title: Conteúdo que não cabe
    content:
      - row:
          - col: [{ picto: scene, name: car-top, driver: human, passenger: machine, w: 300, h: 380 }, { h2: HITL, size: 100 }, { label: humano no loop }, { body: "A máquina sugere. **Você decide.**", size: 32 }]
            items: center
          - col: [{ picto: scene, name: car-top, driver: machine, passenger: human-watch, button: true, w: 300, h: 380 }, { h2: HOTL, size: 100 }, { label: humano sobre o loop }, { body: "A máquina decide. **Você freia.**", size: 32 }]
            items: center
          - col: [{ picto: scene, name: car-top, driver: machine, back: sleep, w: 300, h: 380 }, { h2: HOOTL, size: 100 }, { label: humano fora do loop }, { body: "A máquina faz tudo. **Você dorme.**", size: 32 }]
            items: center
        gap: 60
        flex: 1
      - { label: "Combinado: nas votações, reaja com 👍 = IN ❤️ = ON 😮 = OUT", align: center }

  - layout: end
    title: Obrigado.
    contacts: [equipe@exemplo.com]
    qr: https://www.linkedin.com/in/exemplo-sagadeck
    qrLabel: Meu LinkedIn
    tone: dark
