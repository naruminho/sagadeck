# Roda a suíte (motor + runtime + Studio num Chrome headless) em todo push e pull request, no Linux e no Windows
# (o Studio roda no Windows do banco; caminho com barra invertida e acento só quebra lá).
name: test
on:
  push:
    branches: [main]
  pull_request:

# um push novo na mesma branch/PR cancela o run anterior (a fila não acumula)
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
        env:
          SAGADECK_BROWSER: ${{ matrix.os == 'ubuntu-latest' && '/usr/bin/google-chrome' || 'C:\Program Files\Google\Chrome\Application\chrome.exe' }}
