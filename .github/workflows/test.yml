# Roda a suíte (motor + runtime + Studio num Chrome headless) em todo push e pull request, no Linux e no Windows
# (o Studio roda no Windows do banco; caminho com barra invertida e acento só quebra lá).
# Node 22 e 24: são as versões que as dependências aceitam (pdfjs-dist pede 22.13+; engines do pacote diz o mesmo).
name: test
on:
  push:
    branches: [main]
  pull_request:

# um push novo na mesma branch/PR cancela o run anterior (a fila não acumula)
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # auditoria de dependências de produção: informativa (não derruba o CI); vulnerabilidade conhecida
      # se resolve no mesmo commit que a introduziu (hoje: override de image-size, dependência morta do pptxgenjs)
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      # a suíte vai para arquivo para o passo de falha apontar o que quebrou (anotação + resumo) sem caçar
      # o nome do teste dentro de 30 MB de log do navegador
      - run: npm test 2>&1 | tee test-output.txt
        shell: bash
        env:
          SAGADECK_BROWSER: ${{ matrix.os == 'ubuntu-latest' && '/usr/bin/google-chrome' || 'C:\Program Files\Google\Chrome\Application\chrome.exe' }}
      - if: failure()
        shell: bash
        run: |
          falhas=$(grep -cE '^not ok' test-output.txt || true)
          echo "## $falhas testes falharam (test ${{ matrix.os }}, ${{ matrix.node }})" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^not ok' test-output.txt | head -20 >> "$GITHUB_STEP_SUMMARY"
          grep -B1 -A12 '^not ok' test-output.txt | head -120 >> "$GITHUB_STEP_SUMMARY"
          grep -E '^not ok' test-output.txt | head -10 | while IFS= read -r linha; do echo "::error title=teste falhou::$linha"; done
