# Publica no npm ao criar uma release no GitHub (tag vX.Y.Z). O sagadeck é só Node: o pacote do PyPI parou na 1.5.0.
# Pré-requisito (uma vez, já feito): em npmjs.com > Package Settings > Trusted Publisher, o repositório
# naruminho/sagadeck com este workflow. Release só com a CI verde (regra do CLAUDE.md).
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:  # disparo manual: só confere o pacote, não publica

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # provenance (trusted publishing, sem token)
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm pack --dry-run
      - if: github.event_name == 'release'
        run: npm publish --provenance --access public
