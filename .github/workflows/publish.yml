# Publica no PyPI ao criar uma release no GitHub (tag vX.Y.Z).
# Pré-requisito (uma vez): em pypi.org > Your projects > Publishing, adicionar um
# "trusted publisher" para naruminho/sagadeck com o workflow publish.yml e o ambiente "pypi".
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run bundle
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    if: github.event_name == 'release'  # disparo manual só testa o build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
