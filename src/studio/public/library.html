<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <title>Seu estúdio · SagaDeck</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22%23634ce9%22/%3E%3Cpath d=%22M9 8h14L9 24h14%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22/%3E%3C/svg%3E">
  <script>
    (function () {
      var pref = "light";
      try { pref = JSON.parse(localStorage.getItem("sagadeck.appTheme")) || "light"; } catch (e) {}
      var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="library.css">
</head>
<body class="lib">
  <a href="#main" class="skip-link">Ir para o conteúdo</a>
  <a class="lib-brand" href="biblioteca" aria-label="SagaDeck, início"><span class="lib-logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 8h14L9 24h14"/></svg></span><span>Saga<span class="brand-light">Deck</span><small>ESTÚDIO CRIATIVO</small></span></a>
  <header class="lib-top">
    <div class="breadcrumb">Seu estúdio <span>/</span> <b id="location-name">Visão geral</b></div>
    <div class="spacer"></div>
    <label class="lib-search"><i class="ic" data-ic="search"></i><input id="q" aria-label="Buscar apresentações" placeholder="Buscar apresentações" autocomplete="off"><kbd>/</kbd></label>
    <button class="lib-btn primary" id="btn-new"><i class="ic" data-ic="plus"></i><span class="lbl">Nova apresentação</span></button>
    <button class="lib-icon-btn" id="btn-theme" title="Alternar tema claro e escuro" aria-label="Alternar tema claro e escuro"><i class="ic" data-ic="sun-moon"></i></button>
    <div class="lib-user" id="user" hidden><div class="lib-avatar" id="avatar"></div><span class="uname" id="uname"></span></div>
  </header>
  <div class="lib-body">
    <aside class="lib-side">
      <nav id="side" aria-label="Biblioteca"></nav>
      <a class="lib-btn ghost ai-settings" id="btn-ai" hidden target="_blank" rel="noopener" title="Provedores, chaves e modelos de IA"><i class="ic" data-ic="sliders-horizontal"></i><span>Configurar IA</span></a>
    </aside>
    <main class="lib-main" id="main" tabindex="-1" aria-live="polite"><div class="initial-loading"><span class="loading-orbit"></span>Preparando seu estúdio…</div></main>
  </div>
  <div class="lmenu" id="card-menu" role="menu"></div>
  <div class="lmenu tall" id="new-menu" role="menu">
    <span class="menu-label">COMO VAMOS COMEÇAR?</span>
    <button class="mi" data-new="experience"><i class="ic" data-ic="palette"></i><span><b>Escolher um estilo</b><span class="d">Uma apresentação pronta para transformar</span></span></button>
    <button class="mi" data-new="ai"><i class="ic" data-ic="sparkles"></i><span><b>Criar com IA</b><span class="d">Da sua ideia à primeira versão</span></span></button>
    <button class="mi" data-new="blank"><i class="ic" data-ic="file-plus"></i><span><b>Em branco</b><span class="d">Uma tela livre para a sua ideia</span></span></button>
    <div class="sep"></div>
    <button class="mi" data-new="import"><i class="ic" data-ic="upload"></i><span><b>Importar apresentação</b><span class="d">Arquivo .sagadeck ou .zip</span></span></button>
  </div>
  <div class="lmenu" id="topic-menu" role="menu"></div>
  <input type="file" id="import-input" accept=".sagadeck,.zip" hidden>
  <div class="ldlg-back" id="dlg"><div class="ldlg" role="dialog" aria-modal="true" aria-labelledby="dialog-heading"></div></div>
  <div class="ltoast" id="toast" role="status"></div>
  <script src="ui-icons.js"></script>
  <script src="library.js"></script>
</body>
</html>
